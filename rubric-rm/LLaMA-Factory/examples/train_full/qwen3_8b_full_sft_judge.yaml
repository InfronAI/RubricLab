# Train the RubricRM Judge model (rubric-aware pairwise judge).
#   llamafactory-cli train examples/train_full/qwen3_8b_full_sft_judge.yaml
# Run rubric-rm/scripts/prepare_data.py first to download the data and register
# `openrubric_v2_judge` in data/dataset_info.json.

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: openrubric_v2_judge
template: qwen3
cutoff_len: 6144
max_samples: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
enable_thinking: false

### output
output_dir: saves/openrubric-v2/qwen3-8b/full/judge
logging_steps: 10
save_strategy: steps
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
save_total_limit: 1
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: constant
warmup_ratio: 0.
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

## eval
val_size: 0.02
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 50
