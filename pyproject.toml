[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrubrics-lab"
version = "0.1.0"
description = "RubricLab: rubric-based reward modeling on Apple Silicon with reproducible training, evaluation, and analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "torch==2.8.0", "transformers==4.57.1", "peft==0.17.1",
  "huggingface-hub==0.36.0", "datasets==4.3.0", "numpy>=1.26,<3",
  "matplotlib>=3.9,<4", "httpx>=0.28,<1", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]
demo = ["playwright>=1.50,<2", "pillow>=11,<13"]
api = ["openai>=1.100,<3"]
ifeval = ["absl-py>=2,<3", "langdetect==1.0.9", "nltk>=3.9,<4", "immutabledict>=4,<5"]

[project.scripts]
openrubrics = "openrubrics_lab.cli:main"

[project.urls]
Homepage = "https://github.com/InfronAI/RubricLab"
Repository = "https://github.com/InfronAI/RubricLab.git"
Issues = "https://github.com/InfronAI/RubricLab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrubrics_lab = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires cached model weights and torch"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["rubric-rm/LLaMA-Factory"]
